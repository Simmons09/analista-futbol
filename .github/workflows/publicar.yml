name: Actualizar datos y publicar
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"   # todos los días 6:00 a. m. Colombia
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn
      - run: python scripts/actualizar_datos.py
      - name: Análisis con IA (solo si existe el secreto ANTHROPIC_API_KEY)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analisis_ia.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
      - run: mkdir _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
